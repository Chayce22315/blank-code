name: blank code desktop build

on:
  push:
    branches: ["feat/onboarding-workspace-ui"]
    paths:
      - "app/**"
      - ".github/workflows/blank-code-desktop.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/blank-code-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up .net 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: publish standalone windows app
        run: dotnet publish .\app\BlankCode.Desktop\BlankCode.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output .\publish
      - name: upload windows app
        uses: actions/upload-artifact@v4
        with:
          name: blank-code-windows-x64
          path: .\publish\
          if-no-files-found: error
          retention-days: 14
