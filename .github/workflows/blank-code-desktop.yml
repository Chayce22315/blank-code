name: blank code desktop build

on:
  push:
    branches: ["feat/onboarding-workspace-ui"]
    paths:
      - "app/**"
      - ".github/workflows/blank-code-desktop.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/blank-code-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up .net 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: build native app
        run: dotnet build .\app\BlankCode.Desktop\BlankCode.Desktop.csproj --configuration Release
